<p-table [value]="triggers" styleClass="trigger-table" [rowHover]="true" dataKey="id">
  <ng-template pTemplate="header">
    <tr>
      <th style="width: 60px">Active</th>
      <th>Title</th>
      <th>Type</th>
      <th>Schedule</th>
      <th>Audience</th>
      <th style="width: 120px"></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-t>
    <tr>
      <td>
        <p-inputSwitch [ngModel]="t.active" (onChange)="toggleActive.emit(t.id)" />
      </td>
      <td class="clickable" (click)="edit.emit(t)">
        <span class="trigger-title">{{ t.title }}</span>
      </td>
      <td class="clickable" (click)="edit.emit(t)">
        <span class="type-tag">{{ typeLabel(t.notificationType) }}</span>
      </td>
      <td class="clickable mono" (click)="edit.emit(t)">{{ describe(t) }}</td>
      <td class="clickable" (click)="edit.emit(t)">{{ audienceNames(t) }}</td>
      <td class="actions">
        <button pButton type="button" icon="pi pi-pencil" class="p-button-text p-button-sm"
          (click)="edit.emit(t)"></button>
        <button pButton type="button" icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger"
          (click)="remove.emit(t.id)"></button>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="6">
        <div class="empty-state">
          <p class="empty-state__title">No triggers yet</p>
          <p class="empty-state__body">Create one to start sending on a schedule.</p>
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
